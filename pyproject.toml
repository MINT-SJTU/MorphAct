[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphact"
version = "0.1.0"
description = "Observation-conditioned parameter generation for vision-language-action policies"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7,<2.8",
    "einops>=0.8,<0.9",
    "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["morphact", "morphact.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
